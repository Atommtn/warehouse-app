services:
  warehouse:
    build: .
    container_name: warehouse-app
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:9095
      # همه‌ی رمزها در فایل .env کنار همین فایل هستند (در گیت ذخیره نمی‌شود)؛ نمونه: .env.example
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION:?DB_CONNECTION is not set in .env}
      # پنل پیامک آسانک
      - Sms__Username=${SMS_USERNAME:-}
      - Sms__Password=${SMS_PASSWORD:-}
      - Sms__ApiCode=${API_CODE:-}
      - Sms__Source=${SMS_SOURCE:-}
      # لیست کالاهای دشت برای وصل کردن رسپی‌ها (وب‌هوک فقط‌خواندنی n8n)
      - DashtItems__Url=${DASHT_ITEMS_URL:-}
      - DashtItems__ApiKey=${DASHT_ITEMS_KEY:-}
    ports:
      - "${APP_PORT:-9095}:9095"
    networks:
      - shared-network

networks:
  shared-network:
    external: true
